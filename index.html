<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d1d1f">
  <title>Be Honest... 👀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="topline">
      <span class="brand">BE HONEST 👀</span>
      <span class="step" id="stepLabel">QUESTION 1</span>
    </div>

    <section class="panel" id="questionPanel" aria-live="polite">
      <div class="eyebrow">ANSWER CAREFULLY</div>
      <h1 id="questionText">Are you gay?</h1>
      <div class="answers">
        <button class="answer yes" id="yesButton">YES</button>
        <button class="answer no" id="noButton">NO</button>
      </div>
    </section>

    <section class="panel loading hidden" id="loadingPanel" aria-live="polite">
      <div class="spinner"></div>
      <h1>Analyzing your answer...</h1>
    </section>

    <section class="panel ending hidden" id="endingPanel" aria-live="polite">
      <div class="eyebrow">THE RESULTS ARE IN</div>
      <div class="photo-frame">
        <img id="endingPhoto" src="" alt="Your ending photo">
        <div id="photoFallback" class="photo-fallback">YOUR PHOTO GOES HERE 📸</div>
      </div>
      <h1 id="endingTitle"></h1>
      <p class="subtext" id="endingMessage"></p>
      <button class="answer restart" id="restartButton">PLAY AGAIN ↻</button>
    </section>

      <!-- JUMPSCARE OVERLAY -->
  <div id="scareOverlay" class="scare-overlay">
    <img id="scareImage" src="" alt="Surprise!">
  </div>

    <footer>100% serious test · 0% scientific accuracy</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
